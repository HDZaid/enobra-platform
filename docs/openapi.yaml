openapi: 3.0.3
info:
  title: EnObra API
  version: 1.0.0
  description: 'Contrato HTTP del backend de EnObra (constructora y bienes raíces,
    Quetzaltenango). Todas las rutas cuelgan de /api/v1/. Los endpoints de escritura
    requieren `Authorization: Bearer <access_token>` con rol admin.'
paths:
  /api/v1/admin/media/:
    post:
      operationId: v1_admin_media_create
      summary: Subir imagen (JPEG/PNG/WebP/GIF)
      tags:
      - Medios (admin)
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MediaUploadRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/admin/media/{media_id}/:
    get:
      operationId: v1_admin_media_retrieve
      summary: Metadatos de una imagen
      parameters:
      - in: path
        name: media_id
        schema:
          type: string
        required: true
      tags:
      - Medios (admin)
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    delete:
      operationId: v1_admin_media_destroy
      summary: Eliminar imagen
      parameters:
      - in: path
        name: media_id
        schema:
          type: string
        required: true
      tags:
      - Medios (admin)
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      summary: Iniciar sesión (panel de administración)
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      summary: Cerrar sesión (revoca el refresh)
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      summary: Usuario autenticado actual
      tags:
      - Autenticación
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      summary: Renovar access token
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/company/:
    get:
      operationId: v1_company_retrieve
      summary: Datos de contacto y marca
      tags:
      - Empresa
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
    put:
      operationId: v1_company_update
      summary: Actualizar contacto y marca (admin)
      tags:
      - Empresa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CompanyRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      summary: Estado del servicio
      tags:
      - Sistema
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/inquiries/:
    get:
      operationId: inquiries_list
      summary: Bandeja de solicitudes (admin)
      parameters:
      - in: query
        name: kind
        schema:
          enum:
          - contacto
          - visita
          type: string
          minLength: 1
        description: |-
          * `contacto` - Contacto
          * `visita` - Solicitud de visita
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 12
      - in: query
        name: status
        schema:
          enum:
          - nuevo
          - atendido
          - archivado
          type: string
          minLength: 1
        description: |-
          * `nuevo` - Nuevo
          * `atendido` - Atendido
          * `archivado` - Archivado
      tags:
      - Solicitudes (admin)
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInquiryList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/inquiries/{inquiry_id}/:
    get:
      operationId: inquiries_retrieve
      summary: Detalle de solicitud (admin)
      parameters:
      - in: path
        name: inquiry_id
        schema:
          type: string
        required: true
      tags:
      - Solicitudes (admin)
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inquiry'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    patch:
      operationId: v1_inquiries_partial_update
      summary: 'Cambiar estado: nuevo → atendido → archivado (admin)'
      parameters:
      - in: path
        name: inquiry_id
        schema:
          type: string
        required: true
      tags:
      - Solicitudes (admin)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInquiryStatusUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedInquiryStatusUpdateRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inquiry'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/inquiries/contact/:
    post:
      operationId: v1_inquiries_contact_create
      summary: Enviar formulario de contacto
      tags:
      - Solicitudes (público)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInquiryCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ContactInquiryCreateRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryReceipt'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/inquiries/visits/:
    post:
      operationId: v1_inquiries_visits_create
      summary: Solicitar visita a una propiedad
      tags:
      - Solicitudes (público)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitInquiryCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitInquiryCreateRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InquiryReceipt'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/institution/:
    get:
      operationId: v1_institution_retrieve
      summary: Textos de Nosotros
      tags:
      - Empresa
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institution'
          description: ''
    put:
      operationId: v1_institution_update
      summary: Actualizar textos de Nosotros (admin)
      tags:
      - Empresa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstitutionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InstitutionRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Institution'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/news/:
    get:
      operationId: news_list
      summary: Listar noticias y eventos
      parameters:
      - in: query
        name: category
        schema:
          enum:
          - Anuncios
          - Eventos
          - Proyectos
          type: string
          minLength: 1
        description: |-
          * `Anuncios` - Anuncios
          * `Eventos` - Eventos
          * `Proyectos` - Proyectos
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 12
      tags:
      - Noticias
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNewsList'
          description: ''
    post:
      operationId: v1_news_create
      summary: Crear noticia (admin)
      tags:
      - Noticias
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewsWriteRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/News'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/news/{news_id}/:
    get:
      operationId: news_retrieve
      summary: Publicación completa
      parameters:
      - in: path
        name: news_id
        schema:
          type: string
        required: true
      tags:
      - Noticias
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/News'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    put:
      operationId: v1_news_update
      summary: Reemplazar noticia (admin)
      parameters:
      - in: path
        name: news_id
        schema:
          type: string
        required: true
      tags:
      - Noticias
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewsWriteRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/News'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    patch:
      operationId: v1_news_partial_update
      summary: Editar noticia parcialmente (admin)
      parameters:
      - in: path
        name: news_id
        schema:
          type: string
        required: true
      tags:
      - Noticias
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNewsWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNewsWriteRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/News'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    delete:
      operationId: v1_news_destroy
      summary: Eliminar noticia (admin)
      parameters:
      - in: path
        name: news_id
        schema:
          type: string
        required: true
      tags:
      - Noticias
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/projects/:
    get:
      operationId: projects_list
      description: 'Público: solo `published=true`. Con token admin se incluyen borradores.'
      summary: Listar proyectos (filtro por año)
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 12
      - in: query
        name: year
        schema:
          type: integer
        description: Filtra por año.
      tags:
      - Proyectos
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectList'
          description: ''
    post:
      operationId: v1_projects_create
      summary: Crear proyecto (admin)
      tags:
      - Proyectos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectWriteRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/projects/{project_id}/:
    get:
      operationId: projects_retrieve
      summary: Detalle de proyecto
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
        required: true
      tags:
      - Proyectos
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    put:
      operationId: v1_projects_update
      summary: Reemplazar proyecto (admin)
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
        required: true
      tags:
      - Proyectos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectWriteRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    patch:
      operationId: v1_projects_partial_update
      summary: Editar proyecto parcialmente (admin)
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
        required: true
      tags:
      - Proyectos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProjectWriteRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
    delete:
      operationId: v1_projects_destroy
      summary: Eliminar proyecto (admin)
      parameters:
      - in: path
        name: project_id
        schema:
          type: string
        required: true
      tags:
      - Proyectos
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/v1/projects/years/:
    get:
      operationId: v1_projects_years_retrieve
      summary: Años disponibles para el filtro
      tags:
      - Proyectos
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectYears'
          description: ''
  /api/v1/properties/:
    get:
      operationId: properties_list
      description: 'Público: solo `published=true`. Con token admin se incluyen borradores.'
      summary: Catálogo con filtros combinables, orden y paginación
      parameters:
      - in: query
        name: ids
        schema:
          type: string
          minLength: 1
        description: 'Ids separados por coma (vista ''Favoritos''). Ej.: 1,4,5'
      - in: query
        name: max_price
        schema:
          type: integer
          minimum: 0
      - in: query
        name: min_price
        schema:
          type: integer
          minimum: 0
      - in: query
        name: operation
        schema:
          enum:
          - Venta
          - Alquiler
          type: string
          minLength: 1
        description: |-
          * `Venta` - Venta
          * `Alquiler` - Alquiler
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 12
      - in: query
        name: q
        schema:
          type: string
          default: ''
      - in: query
        name: sort
        schema:
          enum:
          - recent
          - price_asc
          - price_desc
          type: string
          default: recent
          minLength: 1
        description: |-
          * `recent` - Más recientes
          * `price_asc` - Precio ascendente
          * `price_desc` - Precio descendente
      - in: query
        name: type
        schema:
          enum:
          - Casa
          - Apartamento
          - Terreno
          - Local
          type: string
          minLength: 1
        description: |-
