components:
  schemas:
    AccessToken:
      type: object
      properties:
        access:
          type: string
        expires_in:
          type: integer
      required:
      - access
      - expires_in
    Company:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        person:
          type: string
          description: Nombre del responsable (p. ej. Ing. Luis Bernardo Balcárcel
            López).
          maxLength: 160
        address:
          type: string
          maxLength: 255
        phones:
          type: array
          items:
            type: string
        whatsapp:
          description: 'Formato internacional sin ''+'': 502XXXXXXXX.'
          oneOf:
          - type: string
            pattern: ^$|^502\d{8}$
          - type: string
            maxLength: 0
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        instagram:
          oneOf:
          - type: string
            format: uri
          - type: string
            maxLength: 0
        facebook:
          oneOf:
          - type: string
            format: uri
          - type: string
            maxLength: 0
        domain:
          type: string
          maxLength: 255
        logo:
          type: string
          maxLength: 500
      required:
      - address
      - domain
      - email
      - facebook
      - instagram
      - logo
      - name
      - person
      - phones
      - whatsapp
    CompanyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        person:
          type: string
          minLength: 1
          description: Nombre del responsable (p. ej. Ing. Luis Bernardo Balcárcel
            López).
          maxLength: 160
        address:
          type: string
          minLength: 1
          maxLength: 255
        phones:
          type: array
          items:
            type: string
            minLength: 1
        whatsapp:
          description: 'Formato internacional sin ''+'': 502XXXXXXXX.'
          oneOf:
          - type: string
            pattern: ^$|^502\d{8}$
          - type: string
            maxLength: 0
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        instagram:
          oneOf:
          - type: string
            format: uri
          - type: string
            maxLength: 0
        facebook:
          oneOf:
          - type: string
            format: uri
          - type: string
            maxLength: 0
        domain:
          type: string
          maxLength: 255
        logo:
          type: string
          maxLength: 500
      required:
      - address
      - domain
      - email
      - facebook
      - instagram
      - logo
      - name
      - person
      - phones
      - whatsapp
    ContactInquiryCreateRequest:
      type: object
      description: Formulario de Contacto / 'Solicitar información' de Servicios.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          minLength: 1
        phone:
          type: string
          minLength: 1
        subject:
          type: string
          minLength: 1
          description: Título de un servicio (Diseño, Construcción…), 'Bienes raíces'
            u 'Otro'.
          maxLength: 80
        message:
          type: string
          minLength: 1
          maxLength: 2000
        website:
          type: string
          writeOnly: true
          description: 'Honeypot anti-spam: debe enviarse vacío (campo oculto en el
            formulario).'
      required:
      - email
      - message
      - name
      - phone
      - subject
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
